<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>도로롱 · 걷기와 앉기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ed;color:#302b2d;font:14px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;letter-spacing:-1px;margin:2px 0 8px}p{margin:0;color:#72686e}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;color:#995972}.tag{border:1px solid #d6cec9;padding:5px 10px;border-radius:20px;font-size:11px;white-space:nowrap}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0 20px}.panel{border:1px solid #ddd5d0;border-radius:14px;overflow:hidden;background:#fcfaf7}.panel-title{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e7e0db;font-weight:650}.panel-title small{font-weight:400;color:#897e84}canvas{display:block;width:100%;height:auto}button,select{font:inherit;border:1px solid #d3c7cc;border-radius:8px;background:#fff;padding:8px 13px;color:inherit;cursor:pointer}button:hover{background:#eee5e8}button.active{background:#804d63;border-color:#804d63;color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #a96989;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.controls+.controls{margin-top:16px;padding-top:16px;border-top:1px solid #ddd5d0}label{display:flex;align-items:center;gap:8px;margin-right:12px;font-size:13px}input[type=range]{accent-color:#89536b;width:130px}#timeline{width:100%;margin:14px 0 4px}.timeline-labels{display:flex;justify-content:space-between;font-size:11px;color:#86767d}.note{font-size:12px;margin-top:24px;max-width:800px}.status{margin-left:auto;font-size:12px;color:#8b5c73;font-weight:650}.dark .panel{background:#111115;border-color:#303039}.dark .panel-title{background:#202027;border-color:#35353b;color:#e8dee4}.dark .panel-title small{color:#b9a6b1}@media(max-width:700px){main{padding:20px 14px}.views{grid-template-columns:1fr;gap:12px;margin:18px 0}h1{font-size:23px}.tag{display:none}.panel-title{padding:8px 12px}.status{margin-left:0;width:100%}}
/* The desktop sidebar can expose only part of a wider browser viewport. Keep
   the comparison usable in that surface without changing its global zoom. */
main{max-width:620px;margin:0;padding:20px 16px}.views{grid-template-columns:minmax(0,1fr);gap:12px;margin:18px 0}.panel-title{padding:8px 12px}.tag{display:none}h1{font-size:23px}
</style><main>
<header><div><div class="eyebrow">DORORONG / MOTION STUDY</div><h1>걷다가, 잠깐 앉아서 쉬기.</h1><p>앞발 접지 · 뒷다리 접힘 · 부드러운 자세 연결</p></div><span class="tag">비교 미리보기 · 제품 미적용</span></header>
<div class="views"><section class="panel"><div class="panel-title">원본 이동 <small>자세 변형 없는 비교 기준</small></div><canvas id="before" width="640" height="280" aria-label="원본 이동 비교"></canvas></section><section class="panel"><div class="panel-title">새 모션 <small id="phase">준비 중</small></div><canvas id="after" width="640" height="280" aria-label="걷기와 앉기 모션 미리보기"></canvas></section></div>
<div class="controls"><button id="sequence" class="active">연결 재생</button><button id="walk">걷기</button><button id="sit">앉기</button><button id="stand">일어나기</button><button id="pause">일시정지</button><span id="status" class="status">원본 불러오는 중…</span></div>
<input id="timeline" type="range" min="0" max="8" step=".01" value="0" aria-label="연결 동작 구간"><div class="timeline-labels"><span>걷기</span><span>멈춤</span><span>앉기</span><span>쉬기</span><span>일어나기</span></div>
<div class="controls"><label>속도 <input id="speed" type="range" min=".5" max="2" value="1" step=".1"><output id="speedLabel">1.0×</output></label><label><input id="mirror" type="checkbox">좌우 반전</label><label><input id="black" type="checkbox">검은 배경</label><label><input id="joints" type="checkbox">발 접점 표시</label></div>
<p class="note">관절 연결 수정본 · 최종 10-2 그림을 끝 자세로 고정하고 발끝·다리 접힘·엉덩이 위치를 연결한 65장입니다. 일어나기는 같은 프레임을 역순으로 재생합니다. 비교 미리보기이며, 바탕화면 도로롱은 변경하지 않았습니다.</p>
</main><!-- preview-images --><script src="rig.js"></script><script src="contour.js"></script><script src="sit-correspondence.js"></script><script src="authored-sit.js"></script><script src="render.js"></script><script src="preview.js"></script></html>
